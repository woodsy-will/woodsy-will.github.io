<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive map of the Mohawk Valley West Slope harvest-unit planning demonstration: units, skyline corridors, landings, stream exclusion zones and yarding class from public LiDAR.">
  <meta name="robots" content="index, follow">
  <title>Mohawk Valley West Slope - interactive map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root { --ink: #1c2420; --muted: #5c665a; --accent: #2f6b3a; --panel: #ffffff; --border: #d9e0d8; --tractor: #d55e00; --cable: #0072b2; }
    html, body { height: 100%; margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #eef1ea; }
    #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0.55rem 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; align-items: baseline; }
    #bar h1 { font-size: 1.05rem; margin: 0; }
    #bar .sub { color: var(--muted); font-size: 0.85rem; }
    #bar nav a { color: var(--accent); text-decoration: none; margin-right: 0.9rem; font-size: 0.9rem; }
    #bar nav a:hover { text-decoration: underline; }
    #map { position: absolute; top: 58px; bottom: 0; left: 0; right: 0; }
    @media (max-width: 640px) { #map { top: 84px; } }
    .legend { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.7rem; font-size: 0.8rem; line-height: 1.5; max-width: 240px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .legend h3 { margin: 0 0 0.25rem; font-size: 0.85rem; }
    .legend .row { display: flex; align-items: center; gap: 0.45rem; }
    .legend .sw { width: 22px; height: 12px; flex: none; border-radius: 2px; box-sizing: border-box; }
    .legend .ln { width: 22px; height: 0; flex: none; }
    .legend .note { color: var(--muted); font-size: 0.75rem; margin-top: 0.35rem; }
    .leaflet-popup-content { font-size: 0.85rem; line-height: 1.4; margin: 10px 12px; }
    .leaflet-popup-content h4 { margin: 0 0 0.3rem; font-size: 0.95rem; }
    .leaflet-popup-content table { border-collapse: collapse; }
    .leaflet-popup-content td { padding: 1px 6px 1px 0; vertical-align: top; }
    .leaflet-popup-content td:first-child { color: var(--muted); white-space: nowrap; }
    .leaflet-control-layers { font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="bar">
    <h1>Mohawk Valley West Slope: harvest-unit planning</h1>
    <span class="sub">Demonstration from public data (USGS 3DEP LiDAR 2018, USFS EDW, NHD, BLM, Census). Not a Forest Service proposal; cruise plots are simulated.</span>
    <nav>
      <a href="../../../index.html#gis-projects">Portfolio</a>
      <a href="https://github.com/woodsy-will/plumas-lidar-harvest-planning" target="_blank" rel="noopener">Repository</a>
      <a href="https://github.com/woodsy-will/plumas-lidar-harvest-planning/releases/tag/v1.0" target="_blank" rel="noopener">Map sheets and GeoPDFs</a>
      <a href="https://github.com/woodsy-will/plumas-lidar-harvest-planning/blob/main/docs/methods.md" target="_blank" rel="noopener">Methods</a>
    </nav>
  </div>
  <div id="map" role="application" aria-label="Interactive harvest-unit planning map"></div>
  <script>
    const map = L.map('map', { zoomControl: true });
    const usgsTopo = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Basemap: USGS The National Map (public domain)' });
    const usgsImg = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'Basemap: USGS The National Map, imagery with topo (public domain)' });
    usgsTopo.addTo(map);
    L.control.scale({ imperial: true, metric: false }).addTo(map);
    map.attributionControl.addAttribution('Analysis: William Steinley, <a href="https://github.com/woodsy-will/plumas-lidar-harvest-planning">plumas-lidar-harvest-planning</a> (CC BY 4.0)');

    const D = 'data/';
    const fmt = (v, d = 0) => (v === '' || v === null || v === undefined || isNaN(v)) ? '-' : Number(v).toLocaleString('en-US', { maximumFractionDigits: d });
    const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
    const methodColor = m => m === 'Cable' ? getComputedStyle(document.documentElement).getPropertyValue('--cable').trim() : getComputedStyle(document.documentElement).getPropertyValue('--tractor').trim();

    const layers = {};
    const overlays = {};
    const loads = [];
    function add(name, file, opts, addNow) {
      const p = fetch(D + file).then(r => r.json()).then(gj => {
        const lyr = L.geoJSON(gj, opts);
        layers[name] = lyr; overlays[name] = lyr;
        if (addNow) lyr.addTo(map);
        return lyr;
      });
      loads.push(p); return p;
    }

    // yarding class overlay
    const yc = fetch(D + 'yarding_class.json').then(r => r.json()).then(meta => {
      const img = L.imageOverlay(D + 'yarding_class.png', meta.bounds, { opacity: 1, interactive: false, alt: 'Yarding class from planning slope' });
      overlays['Yarding class (planning slope)'] = img; img.addTo(map); return img;
    });
    loads.push(yc);

    add('Treatment block (USFS EDW)', 'block.geojson', { style: { color: '#111', weight: 2.5, dashArray: '8 5', fill: false } }, true);
    add('Riparian conservation areas', 'rca.geojson', { style: { color: '#7fb3d5', weight: 0.6, fillColor: '#bcd7ea', fillOpacity: 0.35 },
      onEachFeature: (f, l) => l.bindPopup(`<h4>Riparian conservation area</h4>${row('Stream class', f.properties.class)}${row('Width', fmt(f.properties.width_ft) + ' ft each side')}<p>SNFPA widths; mapped for context, not an exclusion.</p>`) }, false);
    add('Stream equipment exclusion zones', 'eez.geojson', { style: { color: '#2e6da4', weight: 0.8, fillColor: '#5da2d8', fillOpacity: 0.45 },
      onEachFeature: (f, l) => l.bindPopup(`<h4>Equipment exclusion zone</h4>${row('Stream class', f.properties.class)}${row('Width', fmt(f.properties.width_ft) + ' ft each side')}<p>Netted out of the unit acres.</p>`) }, true);
    add('Streams (NHD)', 'streams.geojson', { style: f => ({ color: '#0070c0', weight: f.properties.class === 'perennial' ? 2.2 : 1.3, dashArray: f.properties.class === 'intermittent' ? '6 4' : (f.properties.class === 'ephemeral' ? '2 4' : null) }),
      onEachFeature: (f, l) => l.bindPopup(`<h4>${f.properties.name || 'Unnamed stream'}</h4>${row('Class', f.properties.class)}`) }, true);
    add('Contours, 200 ft', 'contours200.geojson', { style: { color: '#96502d', weight: 0.9, opacity: 0.8 }, onEachFeature: (f, l) => l.bindTooltip(fmt(f.properties.elev) + ' ft', { sticky: true }) }, false);
    add('Feasible skyline corridors', 'corridors_feasible.geojson', { style: { color: '#222', weight: 0.7, opacity: 0.55 },
      onEachFeature: (f, l) => l.bindPopup(`<h4>Skyline corridor, unit ${f.properties.unit_id}</h4><table>${row('Landing', f.properties.landing_id)}${row('Span', fmt(f.properties.span_ft) + ' ft')}${row('Mid-span deflection', fmt(f.properties.deflection_pct, 1) + ' %')}${row('Minimum clearance', fmt(f.properties.min_clear_ft) + ' ft')}${row('Direction', f.properties.downhill ? 'downhill yarding' : 'uphill yarding')}${row('Span class', f.properties.span_class)}</table>`) }, false);
    add('Candidate landings', 'landings.geojson', { pointToLayer: (f, ll) => L.circleMarker(ll, { radius: f.properties.corridors_ok > 0 ? 4.5 : 3, color: '#333', weight: 1, fillColor: f.properties.corridors_ok > 0 ? '#ffd400' : '#bbb', fillOpacity: 0.95 }),
      onEachFeature: (f, l) => l.bindPopup(`<h4>Landing ${f.properties.landing_id}, unit ${f.properties.unit_id}</h4><table>${row('Elevation', fmt(f.properties.elev) + ' ft')}${row('Feasible corridors', fmt(f.properties.corridors_ok))}${row('Unit coverage', fmt(f.properties.coverage_pct) + ' %')}</table>`) }, false);
    add('Cruise plots (simulated)', 'plots.geojson', { pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 3, color: '#444', weight: 0.8, fillColor: f.properties.flags ? '#e63946' : '#ffffff', fillOpacity: 0.95 }),
      onEachFeature: (f, l) => l.bindPopup(`<h4>Plot ${f.properties.plot}, unit ${f.properties.unit_id}</h4><table>${row('Trees tallied', fmt(f.properties.n_trees))}${row('Slope', fmt(f.properties.slope) + ' %')}${row('QA flags', f.properties.flags || 'none')}</table><p>Simulated BAF 20 cruise; no crew measured these trees.</p>`) }, false);

    let selected = null;
    const unitStyle = f => ({ color: methodColor(f.properties.method), weight: 2.6, fillColor: methodColor(f.properties.method), fillOpacity: 0.06 });
    add('Harvest units (demonstration)', 'units.geojson', {
      style: unitStyle,
      onEachFeature: (f, l) => {
        const p = f.properties; const cable = p.method === 'Cable';
        let html = `<h4>Unit ${p.unit_id}, ${p.method}</h4><table>` +
          row('Gross / net acres', `${fmt(p.acres)} / ${fmt(p.net_acres)}`) + row('Mean slope', `${fmt(p.slope_mean)} % (98th pct ${fmt(p.slope_max)} %)`) +
          row('Aspect', p.aspect) + row('Elevation', `${fmt(p.elev_min)} to ${fmt(p.elev_max)} ft`) + row('Canopy cover', `${fmt(p.cover_pct)} %`) +
          row('Dominant height', `${fmt(p.dom_ht)} ft`) + row('Nearest road', p.road_ft < 1 ? 'inside unit' : `${fmt(p.road_ft)} ft`);
        if (cable) {
          html += row('Landings selected', `${p.landings_used} of ${p.landings}`) + row('Feasible corridors', `${fmt(p.corridors_feasible)} of ${fmt(p.corridors)}`) +
            row('Unit coverage', `${fmt(p.coverage_pct)} %`) + row('Mean deflection', `${fmt(p.mean_deflection_pct, 1)} %`) + row('Longest feasible span', `${fmt(p.max_feasible_span_ft)} ft`) +
            row('Equipment', p.equipment) + row('Difficulty', p.difficulty) + (p.payload_at_best_lb ? row('Allowable load', `${fmt(p.payload_at_best_lb)} lb (7/8 in skyline, SF 3)`) : '');
        } else {
          html += row('System', 'ground-based') + (p.corridors_feasible !== '' ? row('If cable', `${fmt(p.corridors_feasible)} feasible corridors, ${fmt(p.coverage_pct)} % coverage`) : '');
        }
        html += '</table>';
        l.bindPopup(html, { maxWidth: 340 });
        l.bindTooltip(`Unit ${p.unit_id} ${p.method}`, { permanent: false, direction: 'center', className: 'unit-tip' });
        l.on('click', () => { if (selected) selected.setStyle(unitStyle(selected.feature)); l.setStyle({ weight: 4.5, color: '#000', fillOpacity: 0.02 }); selected = l; });
      }
    }, true).then(lyr => { map.fitBounds(lyr.getBounds().pad(0.05)); });

    Promise.all(loads).then(() => {
      const order = ['Yarding class (planning slope)', 'Riparian conservation areas', 'Stream equipment exclusion zones', 'Streams (NHD)', 'Contours, 200 ft', 'Treatment block (USFS EDW)', 'Feasible skyline corridors', 'Candidate landings', 'Cruise plots (simulated)', 'Harvest units (demonstration)'];
      const ov = {}; order.forEach(k => { if (overlays[k]) ov[k] = overlays[k]; });
      L.control.layers({ 'USGS Topo': usgsTopo, 'USGS Imagery Topo': usgsImg }, ov, { collapsed: window.innerWidth < 700 }).addTo(map);
      order.forEach(k => { if (overlays[k] && map.hasLayer(overlays[k]) && overlays[k].bringToFront) overlays[k].bringToFront(); });
    });

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = () => {
      const d = L.DomUtil.create('div', 'legend');
      d.innerHTML = `<h3>Legend</h3>
        <div class="row"><span class="sw" style="border:2.5px solid var(--tractor)"></span>Tractor unit</div>
        <div class="row"><span class="sw" style="border:2.5px solid var(--cable)"></span>Cable unit</div>
        <div class="row"><span class="ln" style="border-top:2.5px dashed #111"></span>Treatment block</div>
        <div class="row"><span class="sw" style="background:#5da2d8;opacity:.6"></span>Stream exclusion zone</div>
        <div class="row"><span class="sw" style="background:#bcd7ea;opacity:.7"></span>Riparian conservation area</div>
        <div class="row"><span class="ln" style="border-top:2px solid #0070c0"></span>Stream (NHD)</div>
        <div class="row"><span class="ln" style="border-top:1px solid #222"></span>Feasible skyline corridor</div>
        <div class="row"><span class="sw" style="background:#ffd400;border:1px solid #333;width:12px;height:12px;border-radius:50%"></span>Landing with feasible corridors</div>
        <div class="row"><span class="sw" style="background:rgb(166,206,189)"></span>Ground-based, slope 35 % and under</div>
        <div class="row"><span class="sw" style="background:rgb(240,228,150)"></span>Marginal, 35 to 50 %</div>
        <div class="row"><span class="sw" style="background:rgb(241,176,140)"></span>Cable, over 50 %</div>
        <div class="note">Click a unit for its attributes and skyline screen. Corridors, landings, contours and plots are in the layer list. CA State Plane data shown in Web Mercator.</div>`;
      L.DomEvent.disableClickPropagation(d); return d;
    };
    legend.addTo(map);
  </script>
</body>
</html>
